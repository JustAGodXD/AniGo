name: Build AniGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get AniGo files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract AniGo
        run: unzip -q AniGo-S103-v0.3-Anime-Login.zip -d buildsrc

      - name: Build APK
        run: gradle -p buildsrc assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AniGo-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
